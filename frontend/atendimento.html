<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="style.css"></head>
<body>
<div class="container">
<h2>Atendimento</h2>

<input id="nome" placeholder="Nome">
<input id="cpf" placeholder="CPF">
<input id="datadenascimento" placeholder="Data de Nascimento">
<input id="sexo" placeholder="Sexo">
<input id="nomedamae" placeholder="Nome da Mãe">
<input id="estadocivil" placeholder="Estado Civil">
<input id="endereco" placeholder="Endereço">
<input id="telefone" placeholder="Telefone">
<input id="email" placeholder="E-mail">
<input id="contatodeemergencia" placeholder="Contato de Emergência">


<select id="tipo">
  <option>Convenio</option>
  <option>Particular</option>
</select>

<input type="file" id="foto">

<button onclick="cadastrar()">Cadastrar</button>
</div>

<script>
function cadastrar(){
 fetch("http://localhost:3000/atendimento",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body: JSON.stringify({
    nome: nome.value,
    cpf: cpf.value,
    datadenascimento: datadenascimento.value,
    sexo: sexo.value,
    nomedamae: nomedamae.value,
    estadocivil: estadocivil.value,
    endereco: endereco.value,
    telefone: telefone.value,
    email: email.value,
    contatodeemergencia: contatodeemergencia.value,
    tipo: tipo.value
  })
 });
 alert("Paciente enviado para triagem");
}
</script>
</body>
</html>
