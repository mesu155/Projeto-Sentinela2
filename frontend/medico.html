<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Médico</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* =====================================================
           BOTÃO DA TV
        ===================================================== */

        .btn-tv {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 8px;
        }

        .btn-tv:hover {
            background: #1e7e34;
        }


        /* =====================================================
           BOTÃO ABRIR TV
        ===================================================== */

        .btn-abrir-tv {
            background: #17a2b8;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-abrir-tv:hover {
            background: #117a8b;
        }


        /* =====================================================
           BOTÃO DAR ALTA
        ===================================================== */

        .btn-alta {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 8px;
        }

        .btn-alta:hover {
            background: #bd2130;
        }


        /* =====================================================
           CONSULTÓRIO
        ===================================================== */

        .consultorio-input {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            background: #f0f4ff;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #d0d8f0;
        }

        .consultorio-input label {
            font-weight: bold;
        }

        .consultorio-input input {
            width: 60px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }


        /* =====================================================
           CARDS DOS PACIENTES
        ===================================================== */

        .card {
            margin-bottom: 15px;
        }


        /* =====================================================
           BOTÕES DOS CARDS
        ===================================================== */

        .botoes-paciente {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         CABEÇALHO
    ===================================================== -->

    <div
        style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        "
    >

        <h2 style="margin:0;">
            🩺 Painel Médico
        </h2>


        <button
            class="btn-abrir-tv"
            onclick="window.open('tv.html','_blank')"
        >
            📺 Abrir Tela da TV
        </button>

    </div>


    <!-- =====================================================
         CONSULTÓRIO
    ===================================================== -->

    <div class="consultorio-input">

        <label>
            Meu Consultório:
        </label>

        <input
            type="text"
            id="consultorio-num"
            value="01"
        >

        <span
            style="
                color:#666;
                font-size:13px;
            "
        >
            Este número será exibido na TV ao chamar o paciente.
        </span>

    </div>


    <!-- =====================================================
         FILA DE TRIAGEM
    ===================================================== -->

    <div id="triagens"></div>


    <hr>


    <!-- =====================================================
         CONSULTA
    ===================================================== -->

    <h3>
        Consulta
    </h3>


    <input
        id="paciente"
        placeholder="Paciente"
        readonly
    >


    <input
        id="diagnostico"
        placeholder="Diagnóstico"
    >


    <select id="medicacao">

        <option value="">
            Selecione a medicação
        </option>

    </select>


    <textarea
        id="obs"
        placeholder="Observações"
    ></textarea>


    <button onclick="salvar()">
        💾 Salvar Consulta
    </button>


</div>



<script>

    // =====================================================
    // VARIÁVEL DAS TRIAGENS
    // =====================================================

    let triagensCarregadas = [];


    // =====================================================
    // CARREGAR TRIAGENS
    // =====================================================

    function carregar() {

        fetch("/triagens")

            .then(r => r.json())

            .then(data => {

                triagensCarregadas = data;

                const div =
                    document.getElementById("triagens");

                div.innerHTML = "";


                // -------------------------------------------------
                // NENHUM PACIENTE
                // -------------------------------------------------

                if (data.length === 0) {

                    div.innerHTML = `
                        <p
                            style="
                                color:#888;
                                text-align:center;
                            "
                        >
                            Nenhum paciente na fila.
                        </p>
                    `;

                    return;
                }


                // -------------------------------------------------
                // MOSTRAR PACIENTES
                // -------------------------------------------------

                data.forEach((t, index) => {

                    div.innerHTML += `

                        <div class="card">

                            <h3>
                                ${t.nome}
                            </h3>


                            <p>
                                <b>Sintoma:</b>
                                ${t.sintoma || "Não informado"}
                            </p>


                            <p>
                                <b>Temperatura:</b>
                                ${t.temperatura || "Não informada"}°C
                            </p>


                            <p>
                                <span class="${t.risco}">
                                    ${t.risco || "Não informado"}
                                </span>
                            </p>


                            <p>
                                <b>Alergia:</b>
                                ${t.alergia || "Nenhuma"}
                            </p>


                            <p>
                                <b>Observação:</b>
                                ${t.observacao || "Nenhuma"}
                            </p>


                            <div class="botoes-paciente">


                                <!-- ATENDER -->

                                <button
                                    onclick="selecionar(${index})"
                                >
                                    👨‍⚕️ Atender
                                </button>


                                <!-- CHAMAR NA TV -->

                                <button
                                    class="btn-tv"
                                    onclick="chamarNaTV(
                                        '${escaparTexto(t.nome)}'
                                    )"
                                >
                                    📺 Chamar na TV
                                </button>


                                <!-- DAR ALTA -->

                                <button
                                    class="btn-alta"
                                    onclick="abrirFormularioAlta(
                                        '${escaparTexto(t.nome)}'
                                    )"
                                >
                                    🏠 Dar Alta
                                </button>


                            </div>

                        </div>

                    `;

                });

            })

            .catch(error => {

                console.error(
                    "Erro ao carregar triagens:",
                    error
                );

            });

    }


    // =====================================================
    // ESCAPAR TEXTO DO NOME
    // Evita problemas quando o nome possui apóstrofo.
    // =====================================================

    function escaparTexto(texto) {

        return String(texto)
            .replace(/\\/g, "\\\\")
            .replace(/'/g, "\\'")
            .replace(/"/g, '\\"');

    }


    // =====================================================
    // CHAMAR PACIENTE NA TV
    // =====================================================

    function chamarNaTV(nome) {

        const consultorio =
            document.getElementById(
                "consultorio-num"
            ).value || "01";


        fetch("/tv/chamar", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                localTipo: "CONSULTÓRIO",

                localNumero: consultorio,

                paciente: nome

            })

        })

        .then(r => r.json())

        .then(() => {

            alert(
                "✅ " +
                nome +
                " foi chamado na TV para o Consultório " +
                consultorio +
                "!"
            );

        })

        .catch(error => {

            console.error(
                "Erro ao chamar paciente:",
                error
            );

            alert(
                "❌ Erro ao chamar paciente na TV."
            );

        });

    }


    // =====================================================
    // SELECIONAR PACIENTE PARA ATENDIMENTO
    // =====================================================

    function selecionar(index) {

        const t =
            triagensCarregadas[index];


        document.getElementById(
            "paciente"
        ).value = t.nome;


        document.getElementById(
            "obs"
        ).value =
            t.observacao || "";


        // -------------------------------------------------
        // AVISAR SOBRE ALERGIA
        // -------------------------------------------------

        if (
            t.alergia &&
            t.alergia !== "Nenhuma"
        ) {

            alert(
                "⚠️ Paciente possui alergia: " +
                t.alergia
            );

        }

    }


    // =====================================================
    // CARREGAR MEDICAÇÕES
    // =====================================================

    function carregarMedicacoes() {

        fetch("/lista-medicacoes")

            .then(r => r.json())

            .then(data => {

                const select =
                    document.getElementById(
                        "medicacao"
                    );


                select.innerHTML = `

                    <option value="">
                        Selecione a medicação
                    </option>

                `;


                data.forEach(med => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value = med;

                    option.textContent = med;


                    select.appendChild(option);

                });

            })

            .catch(error => {

                console.error(
                    "Erro ao carregar medicações:",
                    error
                );

            });

    }


    // =====================================================
    // SALVAR CONSULTA
    // =====================================================

    function salvar() {

        const paciente =
            document.getElementById(
                "paciente"
            ).value;


        const diagnostico =
            document.getElementById(
                "diagnostico"
            ).value;


        const medicacao =
            document.getElementById(
                "medicacao"
            ).value;


        const obs =
            document.getElementById(
                "obs"
            ).value;


        // -------------------------------------------------
        // VERIFICAR PACIENTE
        // -------------------------------------------------

        if (!paciente) {

            alert(
                "Selecione um paciente clicando em Atender."
            );

            return;

        }


        // -------------------------------------------------
        // VERIFICAR MEDICAÇÃO
        // -------------------------------------------------

        if (!medicacao) {

            alert(
                "Selecione uma medicação."
            );

            return;

        }


        // -------------------------------------------------
        // ENVIAR CONSULTA
        // -------------------------------------------------

        fetch("/consulta", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                paciente: paciente,

                diagnostico: diagnostico,

                medicacao: medicacao,

                obs: obs

            })

        })

        .then(r => {

            if (!r.ok) {

                throw new Error(
                    "Erro no servidor"
                );

            }

            return r.json();

        })

        .then(() => {

            alert(
                "✅ Consulta salva!"
            );


            // Limpar diagnóstico

            document.getElementById(
                "diagnostico"
            ).value = "";


            // Limpar medicação

            document.getElementById(
                "medicacao"
            ).value = "";


            // Limpar observações

            document.getElementById(
                "obs"
            ).value = "";


            // Limpar paciente

            document.getElementById(
                "paciente"
            ).value = "";


            // Atualizar fila

            carregar();

        })

        .catch(error => {

            console.error(
                "Erro ao salvar consulta:",
                error
            );

            alert(
                "❌ Erro ao salvar consulta."
            );

        });

    }


    // =====================================================
    // ABRIR PÁGINA DE ALTA
    // =====================================================

    function abrirFormularioAlta(nome) {

        window.location.href =
            "alta.html?paciente=" +
            encodeURIComponent(nome);

    }


    // =====================================================
    // INICIALIZAÇÃO
    // =====================================================

    carregar();

    carregarMedicacoes();


    // =====================================================
    // ATUALIZAR FILA AUTOMATICAMENTE
    // =====================================================

    setInterval(
        carregar,
        10000
    );

</script>


</body>

</html>
